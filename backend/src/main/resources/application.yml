spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/leaseflow
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
 secret: ${JWT_SECRET}
 expiration: 86400000

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
