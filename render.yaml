services:
  - type: web
    name: leaseflow-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: leaseflow-web
    runtime: static
    rootDir: frontend/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
